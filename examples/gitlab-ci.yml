# Keeps the MaKo documents in your own GitLab repository up to date.
# Add this job to the .gitlab-ci.yml of the repository that should hold the documents,
# create a project access token with the scope write_repository (role Developer or higher), store it as masked CI/CD
# variable PUSH_TOKEN and add a pipeline schedule (Build > Pipeline schedules), e.g. daily.
update-mako-documents:
  image: ghcr.io/astral-sh/uv:0.13.5-python3.13-trixie # not slim: git is needed
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    # commit what could be downloaded, report failures at the end
    - status=0
    - >-
      uvx --from "git+https://github.com/decarbon1ze/mako-document-downloader" mako-document-downloader download
      --output mako-documents
      --summary-file /tmp/summary.md
      || status=$?
    - git add --all mako-documents
    - |
      if git diff --cached --quiet; then
        echo "No changes"
      else
        git -c user.name="mako-document-downloader" -c user.email="mako-document-downloader@noreply.invalid" \
          commit --file /tmp/summary.md
        git push -o ci.skip "https://oauth2:${PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
          "HEAD:${CI_COMMIT_REF_NAME}"
      fi
    - exit $status
